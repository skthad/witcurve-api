<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{email.auth.otp.title}">OTP - Witcurve Login</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="shortcut icon" th:href="@{|${baseUrl}/favicon.ico|}" />
</head>
<body>
<p th:text="#{email.auth.otp.greeting(${fullName})}">
    Dear
</p>
<p th:text="#{email.auth.otp.text1(${otp})}">
    Your OTP for logging in to your mobile application is ####.
</p>
<p th:text="#{email.auth.otp.text2}">
    This OTP will expire soon!
</p>
<p>
    This is an auto-generated email. Please do not reply.
</p>
<p>
    <span>Warm Regards, </span>
    <br/>
    <em th:text="#{email.signature(${instituteName})}">Institute Name.</em>
</p>
</body>
</html>
