<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{email.notification.school.event.title(${smsSignature})}">New school event posted</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="shortcut icon" th:href="@{|${baseUrl}/favicon.ico|}" />
</head>
<body>
<p th:text="#{email.notification.greeting(${greetingPlaceholder})}">Dear User,</p>
<p th:text="#{email.notification.subscription(${instituteName})}"/>
<p th:text="#{email.notification.school.event.body(${eventName}, ${date})}"/>
<p th:text="#{email.notification.tinyUrl(${tinyUrl})}"/>
<p>
    This is an auto-generated email. Please do not reply.
</p>
<p>
    <span>Warm Regards, </span>
    <br/>
    <em th:text="#{email.signature(${instituteName})}">Institute Name.</em>
</p>
</body>
</html>
