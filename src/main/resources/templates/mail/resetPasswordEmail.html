<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{email.reset.password.title}">Reset Password | Witcurve</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="shortcut icon" th:href="@{|${baseUrl}/favicon.ico|}" />
</head>
<body>
<p th:text="#{email.reset.password.greeting(${fullName})}">
    Dear
</p>
<p th:text="#{email.reset.password.text1(${resetUrl})}">
    We have received a request to reset the password for your Witcurve account. Visit the link below to set new password.
</p>
<p>
    <a th:href="@{${resetUrl}}">Reset Password</a>
</p>
<p>
    This is an auto-generated email. Please do not reply.
</p>
<p>
    <span>Warm Regards, </span>
    <br/>
    <em th:text="#{${instituteName}}">Institute Name.</em>
</p>
</body>
</html>
