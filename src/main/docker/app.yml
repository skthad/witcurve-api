version: '2'
services:
    witcurve-app:
        image: witcurve
        environment:
            # - _JAVA_OPTIONS=-Xmx512m -Xms256m
            - SPRING_PROFILES_ACTIVE=prod,swagger
            - SPRING_DATASOURCE_URL=jdbc:postgresql://witcurve-postgresql:5432/witcurve
            - JHIPSTER_SLEEP=10 # gives time for the database to boot before the application
        ports:
            - 8080:8080
    witcurve-postgresql:
        extends:
            file: postgresql.yml
            service: witcurve-postgresql
